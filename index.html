<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Folder Icon</title>
        <style>
            :root {
                /* change this to resize the whole icon */
                --size: 470px;
            }

            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                min-height: 100vh;
                display: grid;
                place-items: center;
                background:
                    radial-gradient(
                        ellipse 60% 25% at 85% 45%,
                        rgba(190, 180, 150, 0.35),
                        transparent 70%
                    ),
                    radial-gradient(
                        ellipse 70% 30% at 10% 60%,
                        rgba(170, 170, 150, 0.3),
                        transparent 70%
                    ),
                    linear-gradient(
                        180deg,
                        #5f7472 0%,
                        #66797a 45%,
                        #6c7a78 60%,
                        #5e6e6d 100%
                    );
            }

            /* Everything is drawn on a 470 × 381 grid and scaled. */
            .folder {
                --s: calc(var(--size) / 470px);
                width: var(--size);
                aspect-ratio: 470 / 381;
                position: relative;
            }

            .folder > .inner {
                position: absolute;
                top: 0;
                left: 0;
                width: 470px;
                height: 381px;
                transform: scale(var(--s));
                transform-origin: 0 0;
                filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.28));
            }

            /* Back panel with the tab */
            .back {
                position: absolute;
                inset: 0;
                background: linear-gradient(
                    180deg,
                    #5f61e8 0%,
                    #5557e2 12%,
                    #4f51d8 100%
                );
                clip-path: path(
                    "M0 20 Q0 2 18 2 L136 2 Q152 2 161 13 L171 26 Q178 35 194 35 L452 35 Q470 35 470 53 L470 359 Q470 381 448 381 L22 381 Q0 381 0 359 Z"
                );
            }

            /* subtle highlight along the top edge of the tab */
            .back::after {
                content: "";
                position: absolute;
                inset: 0;
                background: linear-gradient(
                    180deg,
                    rgba(255, 255, 255, 0.18) 0,
                    rgba(255, 255, 255, 0) 6px
                );
            }

            /* White paper sticking out */
            .paper {
                position: absolute;
                left: 17px;
                right: 16px;
                top: 52px;
                height: 60px;
                border-radius: 9px 9px 0 0;
                background: linear-gradient(
                    180deg,
                    #ffffff 0%,
                    #fbfbff 60%,
                    #e9e9f4 100%
                );
            }

            /* Front panel */
            .front {
                position: absolute;
                left: 0;
                right: 0;
                top: 71px;
                bottom: 0;
                border-radius: 22px;
                background: linear-gradient(
                    180deg,
                    #8587f3 0%,
                    #7375f2 9%,
                    #5f61f0 22%,
                    #5b5deb 50%,
                    #5557e0 80%,
                    #5052d8 100%
                );
                box-shadow:
                    0 -3px 6px rgba(30, 30, 90, 0.25),
                    inset 0 1px 0 rgba(255, 255, 255, 0.35),
                    inset 0 -1px 0 rgba(0, 0, 40, 0.15);
            }
        </style>
    </head>
    <body>
        <div class="folder" role="img" aria-label="Folder">
            <div class="inner">
                <div class="back"></div>
                <div class="paper"></div>
                <div class="front"></div>
            </div>
        </div>
    </body>
</html>
